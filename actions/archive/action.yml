name: Archive build output
description: >-
  Deprecated: use actions/release-assets, which this repo's workflows now use.
  Packages a file or directory into `<name>-<version>-<os>-<arch>` as a .zip
  (Windows, macOS) or .tar.gz (Linux), ready to attach to a release.

inputs:
  path:
    description: File or directory to archive. A directory's contents become the archive root.
    required: true
  name:
    description: Base name of the archive, usually the app name.
    required: true
  version:
    description: Version embedded in the archive name, e.g. the tag.
    required: true
  arch:
    description: Arch label for the archive name. Defaults to the runner's (amd64, arm64, ...); set e.g. `universal` for fat binaries.
    default: ""

outputs:
  file:
    description: Path of the created archive, relative to the workspace.
    value: ${{ steps.archive.outputs.file }}

runs:
  using: composite
  steps:
    - id: archive
      shell: bash
      env:
        SRC: ${{ inputs.path }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        ARCH: ${{ inputs.arch }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        os=$(echo "$RUNNER_OS_NAME" | tr '[:upper:]' '[:lower:]')
        case "${ARCH:-$RUNNER_ARCH_NAME}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          X86) arch=386 ;;
          ARM) arch=arm ;;
          *) arch=$(echo "${ARCH:-$RUNNER_ARCH_NAME}" | tr '[:upper:]' '[:lower:]') ;;
        esac

        out_dir="$PWD/.archive"
        mkdir -p "$out_dir"
        base="$NAME-$VERSION-$os-$arch"

        if [ -d "$SRC" ]; then
          src_dir="$SRC"; entries=.
        else
          src_dir=$(dirname "$SRC"); entries=$(basename "$SRC")
        fi

        cd "$src_dir"
        case "$os" in
          linux)   file="$base.tar.gz"; tar -czf "$out_dir/$file" "$entries" ;;
          windows) file="$base.zip";    7z a -tzip -bso0 "$out_dir/$file" "$entries" ;;
          *)       file="$base.zip";    zip -qry "$out_dir/$file" "$entries" ;;
        esac

        echo "Created .archive/$file"
        echo "file=.archive/$file" >> "$GITHUB_OUTPUT"
