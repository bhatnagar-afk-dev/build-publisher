name: Build native app

# Builds a native/desktop application on a matrix of runners and uploads the
# output. With `archive: true` each runner's output is also packaged as
# `<artifact-name>-<version>-<os>-<arch>.{zip,tar.gz}` and uploaded as
# `<artifact-name>-release-<os>-<arch>` for release-github.yml to publish.

on:
  workflow_call:
    inputs:
      runners:
        description: JSON array of runner labels to build on.
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      build-command:
        type: string
        required: true
      artifact-path:
        description: File or directory produced by the build.
        type: string
        required: true
      artifact-name:
        description: Artifact base name, usually the app name. Uploaded as `<name>-<runner.os>`.
        type: string
        required: true
      retention-days:
        type: number
        default: 7
      archive:
        description: Also package the output for a release.
        type: boolean
        default: false
      version:
        description: Version used in archive names. Defaults to the ref name.
        type: string
        default: ""
      go-version-file:
        type: string
        default: go.mod
      node-version:
        type: string
        default: ""
      node-cache-dependency-path:
        type: string
        default: ""
      apt-packages:
        description: Space-separated apt packages, installed on Linux runners only.
        type: string
        default: ""
      go-tools:
        type: string
        default: ""
      setup-commands:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: bhatnagar-afk-dev/build-publisher/actions/setup@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          node-version: ${{ inputs.node-version }}
          node-cache-dependency-path: ${{ inputs.node-cache-dependency-path }}
          apt-packages: ${{ inputs.apt-packages }}
          go-tools: ${{ inputs.go-tools }}
          setup-commands: ${{ inputs.setup-commands }}
      - name: Build
        shell: bash
        run: ${{ inputs.build-command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ runner.os }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - if: inputs.archive
        id: archive
        uses: bhatnagar-afk-dev/build-publisher/actions/archive@v1
        with:
          path: ${{ inputs.artifact-path }}
          name: ${{ inputs.artifact-name }}
          version: ${{ inputs.version || github.ref_name }}
      - if: inputs.archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-release-${{ runner.os }}-${{ runner.arch }}
          path: ${{ steps.archive.outputs.file }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
