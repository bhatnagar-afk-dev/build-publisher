name: Build native app

# Builds a native/desktop application on a matrix of runners and uploads the
# output as a CI artifact. With `release: true` each runner then also runs
# `package-command` (e.g. building installers) and collects its release assets
# -- a zip/tar.gz of the output and/or `package-files` -- named
# `<artifact-name>[-<version>]-<os>-<arch>.<ext>`, uploaded as
# `<artifact-name>-release-<os>-<arch>` for release-github.yml to publish.
#
# `runner-overrides` customises individual runners, e.g. a universal macOS
# build on Apple Silicon with its own installer:
#   runner-overrides: '[{"runner": "macos-latest", "arch": "universal",
#                        "build-command": "make universal",
#                        "package-command": "make dmg", "package-files": "bin/*.dmg"}]'

on:
  workflow_call:
    inputs:
      runners:
        description: JSON array of runner labels to build on.
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      runner-overrides:
        description: >-
          JSON array of `{runner, arch?, build-command?, package-command?,
          package-files?}` objects. Each one applies to the matching entry in
          `runners`: the commands and files replace the defaults for that
          runner, and `arch` replaces runner.arch in artifact and asset names
          (e.g. `universal`).
        type: string
        default: "[]"
      build-command:
        description: Default build command for every runner.
        type: string
        required: true
      artifact-path:
        description: File or directory produced by the build.
        type: string
        required: true
      artifact-name:
        description: Artifact base name, usually the app name. Uploaded as `<name>-<runner.os>-<arch>`, so several runners of one OS can coexist.
        type: string
        required: true
      retention-days:
        type: number
        default: 7
      release:
        description: Package and collect release assets after the build.
        type: boolean
        default: false
      archive:
        description: Deprecated alias for `release`.
        type: boolean
        default: false
      package-command:
        description: >-
          Release mode only: command run after the build, e.g. to create
          installers. RELEASE_VERSION holds the version (`version` input).
        type: string
        default: ""
      package-files:
        description: "Release mode only: newline-separated globs of files (e.g. installers) to attach to the release."
        type: string
        default: ""
      release-archive:
        description: "Release mode only: also attach a zip/tar.gz of `artifact-path`."
        type: boolean
        default: true
      version:
        description: Release version. Defaults to the ref name (the tag on tag pushes).
        type: string
        default: ""
      versioned-asset-names:
        description: >-
          Put the version in release asset names. Turn off for stable names,
          so `releases/latest/download/<asset>` links always work.
        type: boolean
        default: true
      go-version-file:
        type: string
        default: go.mod
      node-version:
        type: string
        default: ""
      node-cache-dependency-path:
        type: string
        default: ""
      apt-packages:
        description: Space-separated apt packages, installed on Linux runners only.
        type: string
        default: ""
      go-tools:
        type: string
        default: ""
      setup-commands:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        # Matrix `include` merges each override into the runner it names.
        include: ${{ fromJSON(inputs.runner-overrides) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: bhatnagar-afk-dev/build-publisher/actions/setup@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          node-version: ${{ inputs.node-version }}
          node-cache-dependency-path: ${{ inputs.node-cache-dependency-path }}
          apt-packages: ${{ inputs.apt-packages }}
          go-tools: ${{ inputs.go-tools }}
          setup-commands: ${{ inputs.setup-commands }}
      - name: Build
        shell: bash
        run: ${{ matrix.build-command || inputs.build-command }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - if: (inputs.release || inputs.archive) && (matrix.package-command || inputs.package-command)
        name: Package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: ${{ matrix.package-command || inputs.package-command }}
      - if: inputs.release || inputs.archive
        id: assets
        uses: bhatnagar-afk-dev/build-publisher/actions/release-assets@v1
        with:
          name: ${{ inputs.artifact-name }}
          version: ${{ inputs.versioned-asset-names && (inputs.version || github.ref_name) || '' }}
          arch: ${{ matrix.arch }}
          archive-path: ${{ inputs.release-archive && inputs.artifact-path || '' }}
          files: ${{ matrix.package-files || inputs.package-files }}
      - if: inputs.release || inputs.archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-release-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: ${{ steps.assets.outputs.dir }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
