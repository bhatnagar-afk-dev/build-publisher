name: PR title

# Enforces Conventional Commits PR titles. Call from a workflow triggered by
# `pull_request_target` (types: opened, edited, synchronize, reopened) with
# `pull-requests: read`.

on:
  workflow_call:
    inputs:
      types:
        description: Newline-separated allowed types. Empty uses the action's defaults.
        type: string
        default: ""
      require-scope:
        type: boolean
        default: false

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.require-scope }}
